<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tux Search - AI-powered RAG semantic search engine with chat interface">
    <title>Tux Search - RAG Search Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: rgba(255,255,255,0.04);
            --accent-1: #6c63ff;
            --accent-2: #a855f7;
            --accent-3: #06b6d4;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(255,255,255,0.08);
            --glass: rgba(255,255,255,0.03);
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg-primary);
            color:var(--text-primary);
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        /* Header */
        .header {
            background:linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom:1px solid var(--border);
            padding:1rem 2rem;
            display:flex;
            align-items:center;
            justify-content:space-between;
            backdrop-filter:blur(20px);
            position:relative;
            z-index:10;
        }
        .header::after {
            content:'';
            position:absolute;
            bottom:0;left:0;right:0;
            height:1px;
            background:linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), transparent);
        }
        .header-left { display:flex; align-items:center; gap:1rem; }
        .logo {
            width:40px;height:40px;
            background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius:12px;
            display:flex;align-items:center;justify-content:center;
            font-size:1.2rem;font-weight:700;
            box-shadow:0 0 20px rgba(108,99,255,0.3);
        }
        .header h1 { font-size:1.3rem; font-weight:600; }
        .header .subtitle { font-size:0.75rem; color:var(--text-muted); margin-top:2px; }
        .status-badge {
            display:flex;align-items:center;gap:6px;
            padding:6px 14px;
            background:rgba(16,185,129,0.1);
            border:1px solid rgba(16,185,129,0.2);
            border-radius:20px;font-size:0.75rem;color:#10b981;
        }
        .status-dot { width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        /* Main Layout */
        .main-container { display:flex; flex:1; overflow:hidden; }

        /* Sidebar */
        .sidebar {
            width:280px;
            background:var(--bg-secondary);
            border-right:1px solid var(--border);
            display:flex;flex-direction:column;
            overflow-y:auto;
        }
        .sidebar-section { padding:1.2rem; border-bottom:1px solid var(--border); }
        .sidebar-section h3 {
            font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px;
            color:var(--text-muted); margin-bottom:0.8rem; font-weight:600;
        }
        .session-id {
            font-family:'Courier New',monospace; font-size:0.7rem;
            color:var(--accent-3); word-break:break-all;
            padding:8px 12px; background:rgba(6,182,212,0.05);
            border:1px solid rgba(6,182,212,0.1); border-radius:8px;
        }
        .btn {
            width:100%; padding:10px; border:none; border-radius:10px;
            font-size:0.8rem; font-weight:500; cursor:pointer;
            transition:all 0.2s; font-family:inherit;
        }
        .btn-primary {
            background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color:white;
        }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(108,99,255,0.4); }
        .btn-ghost {
            background:var(--bg-card); color:var(--text-secondary);
            border:1px solid var(--border);
        }
        .btn-ghost:hover { background:rgba(255,255,255,0.08); color:var(--text-primary); }
        .btn-danger { background:rgba(239,68,68,0.1); color:#ef4444; border:1px solid rgba(239,68,68,0.2); }
        .btn-danger:hover { background:rgba(239,68,68,0.2); }
        .btn-group { display:flex; flex-direction:column; gap:8px; }
        .stats-grid { display:flex; flex-direction:column; gap:8px; }
        .stat-item {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 12px; background:var(--bg-card); border-radius:8px;
            border:1px solid var(--border);
        }
        .stat-label { font-size:0.75rem; color:var(--text-muted); }
        .stat-value { font-size:0.85rem; font-weight:600; color:var(--accent-3); }

        /* Chat Area */
        .chat-container { flex:1; display:flex; flex-direction:column; position:relative; }
        .chat-messages {
            flex:1; overflow-y:auto; padding:1.5rem 2rem;
            display:flex; flex-direction:column; gap:1rem;
            scroll-behavior:smooth;
        }
        .chat-messages::-webkit-scrollbar { width:6px; }
        .chat-messages::-webkit-scrollbar-track { background:transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

        /* Messages */
        .message {
            max-width:75%; padding:1rem 1.3rem;
            border-radius:var(--radius); line-height:1.6;
            animation:msgIn 0.3s ease; font-size:0.9rem;
            position:relative;
        }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        .message.user {
            background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color:white; align-self:flex-end;
            border-bottom-right-radius:4px;
            box-shadow:0 4px 15px rgba(108,99,255,0.25);
        }
        .message.assistant {
            background:var(--bg-card); color:var(--text-primary);
            align-self:flex-start; border-bottom-left-radius:4px;
            border:1px solid var(--border);
        }
        .message .timestamp {
            font-size:0.65rem; opacity:0.5; margin-top:8px; display:block;
        }
        .message .sources {
            margin-top:0.8rem; padding-top:0.8rem;
            border-top:1px solid rgba(255,255,255,0.1);
        }
        .message .sources h4 { font-size:0.75rem; margin-bottom:6px; color:var(--text-muted); }
        .message .sources a {
            display:inline-block; font-size:0.7rem;
            color:var(--accent-3); text-decoration:none;
            padding:3px 10px; margin:3px 4px 3px 0;
            background:rgba(6,182,212,0.08); border:1px solid rgba(6,182,212,0.15);
            border-radius:12px; transition:all 0.2s;
        }
        .message .sources a:hover { background:rgba(6,182,212,0.15); }

        /* Typing */
        .typing-indicator {
            display:none; align-self:flex-start;
            background:var(--bg-card); padding:1rem 1.3rem;
            border-radius:var(--radius); border-bottom-left-radius:4px;
            border:1px solid var(--border);
        }
        .typing-indicator span {
            display:inline-block; width:7px; height:7px;
            border-radius:50%; background:var(--accent-1);
            margin:0 2px; animation:bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2){animation-delay:0.2s;}
        .typing-indicator span:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}

        /* Input */
        .input-area {
            padding:1.2rem 2rem;
            background:var(--bg-secondary);
            border-top:1px solid var(--border);
            display:flex; gap:0.8rem; align-items:center;
        }
        .input-area input {
            flex:1; padding:0.9rem 1.3rem;
            background:var(--bg-card); color:var(--text-primary);
            border:1px solid var(--border); border-radius:14px;
            font-size:0.9rem; outline:none; font-family:inherit;
            transition:border-color 0.3s;
        }
        .input-area input::placeholder { color:var(--text-muted); }
        .input-area input:focus { border-color:var(--accent-1); }
        #sendButton {
            padding:0.9rem 1.8rem;
            background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color:white; border:none; border-radius:14px;
            font-size:0.9rem; font-weight:600; cursor:pointer;
            transition:all 0.2s; font-family:inherit;
            white-space:nowrap;
        }
        #sendButton:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(108,99,255,0.4); }
        #sendButton:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }

        /* Empty State */
        .empty-state {
            text-align:center; padding:4rem 2rem; color:var(--text-muted);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            flex:1;
        }
        .empty-icon {
            width:80px;height:80px;margin-bottom:1.5rem;
            background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius:24px; display:flex;align-items:center;justify-content:center;
            font-size:2rem; opacity:0.6;
        }
        .empty-state p { margin-top:0.4rem; }
        .empty-state .hint { font-size:0.8rem; margin-top:1rem; color:var(--text-muted); }

        /* Toast */
        .toast {
            position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
            background:var(--bg-tertiary);border:1px solid var(--border);
            padding:12px 24px;border-radius:12px;font-size:0.85rem;
            color:var(--text-primary);box-shadow:var(--shadow);
            opacity:0;transition:all 0.3s;pointer-events:none;z-index:100;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        @media(max-width:768px){
            .sidebar{display:none;}
            .header{padding:0.8rem 1rem;}
            .chat-messages{padding:1rem;}
            .input-area{padding:0.8rem 1rem;}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">T</div>
            <div>
                <h1>Tux Search</h1>
                <div class="subtitle">RAG-Powered Semantic Search · OpenRouter AI</div>
            </div>
        </div>
        <div class="status-badge"><div class="status-dot"></div>Online</div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h3>Session</h3>
                <div class="session-id" id="sessionId">-</div>
                <div class="btn-group" style="margin-top:1rem;">
                    <button class="btn btn-ghost" onclick="newSession()">✦ New Session</button>
                    <button class="btn btn-danger" onclick="clearChat()">✕ Clear Chat</button>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>Actions</h3>
                <div class="btn-group">
                    <button class="btn btn-ghost" onclick="startCrawl()">🔍 Crawl Website</button>
                    <button class="btn btn-ghost" onclick="reindex()">📑 Re-index Documents</button>
                    <button class="btn btn-ghost" onclick="checkHealth()">💓 Health Check</button>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-label">Messages</span><span class="stat-value" id="msgCount">0</span></div>
                    <div class="stat-item"><span class="stat-label">Vector DB</span><span class="stat-value" id="vectorCount">-</span></div>
                    <div class="stat-item"><span class="stat-label">Model</span><span class="stat-value" style="font-size:0.7rem;">qwen3-coder</span></div>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">💬</div>
                    <p style="font-size:1.1rem;font-weight:500;color:var(--text-primary);">Start a Conversation</p>
                    <p style="font-size:0.85rem;">Ask questions about your indexed documents</p>
                    <p class="hint">Powered by OpenRouter · qwen/qwen3-coder:free</p>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Ask a question about your documents..." autocomplete="off">
                <button id="sendButton" onclick="sendMessage()">Send ↗</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        let sessionId='';
        let messageCount=0;

        initSession();
        loadChatHistory();
        updateStats();

        function initSession(){
            sessionId=localStorage.getItem('tuxSearchSessionId');
            if(!sessionId){
                sessionId='sess-'+Date.now().toString(36)+'-'+Math.random().toString(36).substr(2,9);
                localStorage.setItem('tuxSearchSessionId',sessionId);
            }
            document.getElementById('sessionId').textContent=sessionId;
        }

        function newSession(){
            localStorage.removeItem('tuxSearchSessionId');
            initSession();
            clearChatMessages();
            messageCount=0;
            updateStats();
            showEmptyState();
            showToast('New session started');
        }

        function clearChat(){
            if(confirm('Clear all chat messages in this session?')){
                fetch('/api/chat/clear?sessionId='+sessionId)
                    .then(()=>{clearChatMessages();messageCount=0;updateStats();showEmptyState();showToast('Chat cleared');})
                    .catch(err=>showToast('Error: '+err));
            }
        }

        function clearChatMessages(){document.getElementById('chatMessages').innerHTML='';}

        function showEmptyState(){
            const c=document.getElementById('chatMessages');
            if(c.children.length===0){
                c.innerHTML='<div class="empty-state" id="emptyState"><div class="empty-icon">💬</div><p style="font-size:1.1rem;font-weight:500;color:var(--text-primary);">Start a Conversation</p><p style="font-size:0.85rem;">Ask questions about your indexed documents</p><p class="hint">Powered by OpenRouter · qwen/qwen3-coder:free</p></div>';
            }
        }

        async function sendMessage(){
            const input=document.getElementById('messageInput');
            const query=input.value.trim();
            if(!query){input.focus();return;}

            addMessage(query,'user');
            input.value='';
            messageCount++;
            showTyping();

            try{
                const res=await fetch('/api/ask?q='+encodeURIComponent(query)+'&sessionId='+sessionId);
                if(!res.ok) throw new Error('HTTP '+res.status);
                const data=await res.json();
                hideTyping();
                addMessage(data.answer,'assistant',data.sources);
                messageCount++;
                updateStats();
            }catch(err){
                hideTyping();
                addMessage('Error: Could not connect to the backend. Is the server running?','assistant');
                console.error(err);
            }
        }

        function addMessage(text,role,sources=null){
            const c=document.getElementById('chatMessages');
            const es=document.getElementById('emptyState');
            if(es) es.remove();

            const div=document.createElement('div');
            div.className='message '+role;
            let html='<div>'+text.replace(/\n/g,'<br>')+'</div>';
            if(sources&&sources.length>0){
                html+='<div class="sources"><h4>📎 Sources</h4>';
                sources.forEach(s=>{html+='<a href="'+s.url+'" target="_blank">'+s.title+'</a>';});
                html+='</div>';
            }
            html+='<span class="timestamp">'+new Date().toLocaleTimeString()+'</span>';
            div.innerHTML=html;
            c.appendChild(div);
            c.scrollTop=c.scrollHeight;
        }

        function showTyping(){
            document.getElementById('typingIndicator').style.display='flex';
            document.getElementById('sendButton').disabled=true;
            document.getElementById('messageInput').disabled=true;
        }

        function hideTyping(){
            document.getElementById('typingIndicator').style.display='none';
            document.getElementById('sendButton').disabled=false;
            document.getElementById('messageInput').disabled=false;
            document.getElementById('messageInput').focus();
        }

        async function loadChatHistory(){
            try{
                const res=await fetch('/api/chat/history?sessionId='+sessionId);
                if(res.ok){
                    const history=await res.json();
                    if(history&&history.length>0){
                        const es=document.getElementById('emptyState');
                        if(es) es.remove();
                        history.forEach(msg=>{addMessage(msg.content,msg.role);messageCount++;});
                    }
                }
            }catch(e){/* ignore */}
        }

        async function updateStats(){
            document.getElementById('msgCount').textContent=messageCount;
            try{
                const res=await fetch('/api/vector-db/stats');
                if(res.ok){
                    const text=await res.text();
                    document.getElementById('vectorCount').textContent=text.includes('Chunks:')? text.split('Chunks:')[1].trim():text;
                }
            }catch(e){}
        }

        function startCrawl(){
            const url=prompt('Enter URL to crawl:');
            if(url){
                const depth=prompt('Crawl depth (default 2):','2');
                fetch('/api/crawl?startUrl='+encodeURIComponent(url)+'&depth='+(depth||2))
                    .then(r=>r.text()).then(t=>showToast(t)).catch(e=>showToast('Error: '+e));
            }
        }

        function reindex(){
            if(confirm('Re-index all documents?')){
                fetch('/api/index').then(r=>r.text()).then(t=>showToast(t)).catch(e=>showToast('Error: '+e));
            }
        }

        async function checkHealth(){
            try{
                const res=await fetch('/api/health');
                const text=await res.text();
                showToast(text);
            }catch(e){showToast('Backend unreachable');}
        }

        function showToast(msg){
            const t=document.getElementById('toast');
            t.textContent=msg;t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'),3000);
        }

        document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
