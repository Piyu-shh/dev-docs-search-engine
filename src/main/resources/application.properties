spring.application.name=search
spring.data.mongodb.uri=${DB_URL:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/search}}

# ===== Redis Configuration (for chat context caching) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}

# ===== Chroma Vector Database Configuration =====
chroma.url=${CHROMA_URL:http://localhost:8000}
chroma.collection.name=${CHROMA_COLLECTION:web_pages_chunks}

# ===== OpenRouter Configuration =====
# OpenRouter API key (set via OPENROUTER_API_KEY or OPEN_ROUTER environment variable)
openrouter.api.key=${OPENROUTER_API_KEY:${OPEN_ROUTER:your_openrouter_api_key_here}}

# OpenRouter API endpoint
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1}

# Embedding model (free) - NVIDIA multimodal embedding model
openrouter.embedding.model=${OPENROUTER_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2:free}

# Chat model (free)
openrouter.chat.model=${OPENROUTER_CHAT_MODEL:qwen/qwen3-coder:free}

# Application info for OpenRouter headers
app.url=${APP_URL:http://localhost:8080}
app.name=${APP_NAME:Tux-Search-Engine}

# ===== Chunking Configuration =====
chunk.size.tokens=512
chunk.overlap.tokens=50

# ===== Chat Context Configuration =====
chat.context.max.messages=10

# ===== Lucene Search Configuration =====
lucene.results.count=10

# ===== Chroma Query Configuration =====
chroma.results.count=5