services:
  redis:
    image: redis:7
    container_name: search-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "" 
      # Remove --requirepass line if you want authentication
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - search-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: search-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - search-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  chroma-data:
    driver: local

networks:
  search-network:
    driver: bridge
